# LightCraft for omapak, repackaged from upstream's own release tarball.
#
# storytold/lightcraft ships a flatpak-builder manifest and a full set of release
# artifacts for every tag, including a single-file .flatpak built by
# packaging/linux/flatpak/ai.storyteller.lightcraft.bundle.yml. That bundle
# manifest repackages the release's Linux tarball instead of compiling Rust
# inside flatpak-builder; this manifest is that same file, so what omapak ships
# is byte-for-byte the binaries upstream published.
#
# Everything below — runtime, command, finish-args, install steps — is
# upstream's and is meant to stay identical to their bundle manifest. The one
# omapak-side change is the source: the tarball per arch, pinned by sha256 and
# annotated with x-checker-data, so update-apps.yml
# (flatpak-external-data-checker) bumps the version, URL and digest by itself
# when upstream tags a release and opens a PR that goes through the judge.
#
# The installed metainfo is the one inside the tarball, where upstream's
# package.sh has already substituted the release's version and date. The copy
# in this directory is what the judge lints and the site catalog reads.
id: ai.storyteller.lightcraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: lightcraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # The library lives in ~/Pictures/LightCraft Library by default, and imports usually come from
  # Pictures. Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend) and
  # drag-and-drop through the document portal, so picked folders elsewhere work without broad
  # filesystem access.
  - --filesystem=xdg-pictures
  # Deliberately not granted: home/host filesystem access, and network. The network is only for
  # the optional SAM 3 model download (AI Object/Describe masks, docs/ai-masks.md); without it
  # that download fails with an error and everything else works. Users who want it run
  # `flatpak override --user --share=network ai.storyteller.lightcraft`.
modules:
  - name: lightcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/lightcraft /app/bin/lightcraft
      - install -Dm755 bin/lightcraft-cli /app/bin/lightcraft-cli
      - install -Dm644 share/applications/ai.storyteller.lightcraft.desktop /app/share/applications/ai.storyteller.lightcraft.desktop
      # The same MIME definitions the deb/rpm install.
      - install -Dm644 share/mime/packages/ai.storyteller.lightcraft.xml /app/share/mime/packages/ai.storyteller.lightcraft.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/ai.storyteller.lightcraft.metainfo.xml /app/share/metainfo/ai.storyteller.lightcraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/lightcraft /app/share/doc/
    sources:
      - type: archive
        url: https://github.com/storytold/lightcraft/releases/download/v0.4.0/lightcraft-0.4.0-linux-x86_64.tar.gz
        sha256: c2c75780bcf058a21c4a311ce57db47e59f0ac2f6dd7045833769ae1003b5723
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/storytold/lightcraft/releases/latest
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: '"https://github.com/storytold/lightcraft/releases/download/v" + $version + "/lightcraft-" + $version + "-linux-x86_64.tar.gz"'
          is-main-source: true
      - type: archive
        url: https://github.com/storytold/lightcraft/releases/download/v0.4.0/lightcraft-0.4.0-linux-aarch64.tar.gz
        sha256: 69d8425b0b30c973a2cc072b25cf9031081c144bc43e52b7cea722eb9e8a8100
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/storytold/lightcraft/releases/latest
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: '"https://github.com/storytold/lightcraft/releases/download/v" + $version + "/lightcraft-" + $version + "-linux-aarch64.tar.gz"'
