submitter: jon
source_repo: https://github.com/storytold/lightcraft
summary: Organise photos and develop raw files, non-destructively
license: MIT OR Apache-2.0
homepage: https://getartcraft.com/apps/lightcraft
tags: [graphics, photography, raw]
description: >-
  LightCraft is a non-destructive raw photo organiser and developer, part
  of the ArtCraft Crafting Apps: a clean-room suite written in Rust by
  Learning Machines LLC.

  Packaged from upstream's release tarball at v0.4.0
  (lightcraft-0.4.0-linux-x86_64.tar.gz and the aarch64 build), the same
  artifact their own single-file .flatpak is built from, using their own
  bundle manifest unchanged. x-checker-data tracks the GitHub release
  feed, so a new upstream tag arrives here as an automatic version-bump PR
  and is judged like any other submission.
