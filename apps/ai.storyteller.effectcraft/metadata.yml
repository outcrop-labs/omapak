submitter: jon
source_repo: https://github.com/storytold/effectcraft
summary: Motion graphics and visual effects compositor
license: MIT OR Apache-2.0
homepage: https://getartcraft.com/apps/effectcraft
tags: [graphics, video, motion-graphics]
description: >-
  EffectCraft is a motion-graphics and visual-effects compositor, part of
  the ArtCraft Crafting Apps: a clean-room suite written in Rust by
  Learning Machines LLC.

  Packaged from upstream's release tarball at v0.6.0
  (effectcraft-0.6.0-linux-x86_64.tar.gz and the aarch64 build), the same
  artifact their own single-file .flatpak is built from, using their own
  bundle manifest unchanged. x-checker-data tracks the GitHub release
  feed, so a new upstream tag arrives here as an automatic version-bump PR
  and is judged like any other submission.

  Upstream grants --share=network here, which its sibling apps do not.
