# EffectCraft for omapak, repackaged from upstream's own release tarball.
#
# storytold/effectcraft ships a flatpak-builder manifest and a full set of release
# artifacts for every tag, including a single-file .flatpak built by
# packaging/linux/flatpak/ai.storyteller.effectcraft.bundle.yml. That bundle
# manifest repackages the release's Linux tarball instead of compiling Rust
# inside flatpak-builder; this manifest is that same file, so what omapak ships
# is byte-for-byte the binaries upstream published.
#
# Everything below — runtime, command, finish-args, install steps — is
# upstream's and is meant to stay identical to their bundle manifest. The one
# omapak-side change is the source: the tarball per arch, pinned by sha256 and
# annotated with x-checker-data, so update-apps.yml
# (flatpak-external-data-checker) bumps the version, URL and digest by itself
# when upstream tags a release and opens a PR that goes through the judge.
#
# The installed metainfo is the one inside the tarball, where upstream's
# package.sh has already substituted the release's version and date. The copy
# in this directory is what the judge lints and the site catalog reads.
id: ai.storyteller.effectcraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: effectcraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu compositor and renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Audio preview and playback (cpal through ALSA, which the runtime routes to PulseAudio or
  # PipeWire's Pulse server).
  - --socket=pulseaudio
  # The optional trained models (Settings ▸ Roto Brush, Settings ▸ Face Tracking) download only
  # when the user asks, over HTTPS with curl. It also lets host agents reach the optional
  # --control server (127.0.0.1). No telemetry: nothing else uses the network.
  - --share=network
  # Open/Save and import dialogs go through the file-chooser portal (rfd's xdg-portal backend) and
  # drag-and-drop through the document portal, so picked files work anywhere without broad
  # filesystem access. Pictures, Videos and Documents are granted so files passed by path (the
  # command line, Open Recent, footage a project links to, Render Queue output) work in the
  # usual places.
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
  - --filesystem=xdg-documents
  # Deliberately not granted: home/host filesystem access.
modules:
  - name: effectcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/effectcraft /app/bin/effectcraft
      - install -Dm755 bin/effectcraft-cli /app/bin/effectcraft-cli
      - install -Dm644 share/applications/ai.storyteller.effectcraft.desktop /app/share/applications/ai.storyteller.effectcraft.desktop
      - install -Dm644 share/mime/packages/ai.storyteller.effectcraft.xml /app/share/mime/packages/ai.storyteller.effectcraft.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/ai.storyteller.effectcraft.metainfo.xml /app/share/metainfo/ai.storyteller.effectcraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/effectcraft /app/share/doc/
    sources:
      - type: archive
        url: https://github.com/storytold/effectcraft/releases/download/v0.6.0/effectcraft-0.6.0-linux-x86_64.tar.gz
        sha256: 71810719903378cdab32a1fe328f23c874d38cd3d833abb19c6263dd2bad218c
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/storytold/effectcraft/releases/latest
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: '"https://github.com/storytold/effectcraft/releases/download/v" + $version + "/effectcraft-" + $version + "-linux-x86_64.tar.gz"'
          is-main-source: true
      - type: archive
        url: https://github.com/storytold/effectcraft/releases/download/v0.6.0/effectcraft-0.6.0-linux-aarch64.tar.gz
        sha256: 77cc576b9b1c7b6436e997f24a8c50b05783f6cbe573aaeaa0ec7e105877458e
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/storytold/effectcraft/releases/latest
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: '"https://github.com/storytold/effectcraft/releases/download/v" + $version + "/effectcraft-" + $version + "-linux-aarch64.tar.gz"'
