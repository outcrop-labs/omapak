# PdfCraft for omapak, repackaged from upstream's own release tarball.
#
# storytold/pdfcraft ships a flatpak-builder manifest and a full set of release
# artifacts for every tag, including a single-file .flatpak built by
# packaging/linux/flatpak/ai.storyteller.pdfcraft.bundle.yml. That bundle
# manifest repackages the release's Linux tarball instead of compiling Rust
# inside flatpak-builder; this manifest is that same file, so what omapak ships
# is byte-for-byte the binaries upstream published.
#
# Everything below — runtime, command, finish-args, install steps — is
# upstream's and is meant to stay identical to their bundle manifest. The one
# omapak-side change is the source: the tarball per arch, pinned by sha256 and
# annotated with x-checker-data, so update-apps.yml
# (flatpak-external-data-checker) bumps the version, URL and digest by itself
# when upstream tags a release and opens a PR that goes through the judge.
#
# The installed metainfo is the one inside the tarball, where upstream's
# package.sh has already substituted the release's version and date. The copy
# in this directory is what the judge lints and the site catalog reads.
id: ai.storyteller.pdfcraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: pdfcraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend) and
  # drag-and-drop through the document portal, so picked files work anywhere without broad
  # filesystem access. Documents and Downloads, where PDFs usually live, are granted so files
  # passed by path (the command line, Open Recent, "Save" next to the original) work there.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # Deliberately not granted: network (Flatpak installs update through flatpak, so Help ▸ Check
  # for updates reports that GitHub is unreachable; the optional --control channel listens on
  # 127.0.0.1 inside the sandbox) and home/host filesystem access. No CUPS socket either: printing
  # runs the `lp` command (crates/print), which the freedesktop runtime doesn't ship, so Print
  # reports that the spooler is unavailable until it goes through the print portal.
modules:
  - name: pdfcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/pdfcraft /app/bin/pdfcraft
      - install -Dm755 bin/pdfcraft-cli /app/bin/pdfcraft-cli
      - install -Dm644 share/applications/ai.storyteller.pdfcraft.desktop /app/share/applications/ai.storyteller.pdfcraft.desktop
      - install -Dm644 share/mime/packages/ai.storyteller.pdfcraft.xml /app/share/mime/packages/ai.storyteller.pdfcraft.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/ai.storyteller.pdfcraft.metainfo.xml /app/share/metainfo/ai.storyteller.pdfcraft.metainfo.xml
      # Licences, including the embedded craft-fonts' OFL texts.
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/pdfcraft /app/share/doc/
    sources:
      - type: archive
        url: https://github.com/storytold/pdfcraft/releases/download/v0.4.0/pdfcraft-0.4.0-linux-x86_64.tar.gz
        sha256: 4879b3cdb4d1261945af03b1c5f00f3e868d05e84e77911960cac505aa16c1db
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/storytold/pdfcraft/releases/latest
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: '"https://github.com/storytold/pdfcraft/releases/download/v" + $version + "/pdfcraft-" + $version + "-linux-x86_64.tar.gz"'
          is-main-source: true
      - type: archive
        url: https://github.com/storytold/pdfcraft/releases/download/v0.4.0/pdfcraft-0.4.0-linux-aarch64.tar.gz
        sha256: 08b2ff6c538adb3cc08a88814a3cce6eee09cb98c9af934c393a5131a315590e
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/storytold/pdfcraft/releases/latest
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: '"https://github.com/storytold/pdfcraft/releases/download/v" + $version + "/pdfcraft-" + $version + "-linux-aarch64.tar.gz"'
