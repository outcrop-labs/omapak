description: >-
  Continuity submission. Rocker (Apache-2.0, Rust) is a Docker desktop
  client. Its Flathub submission (flathub/flathub#10154) passed Flathub's own
  test build and was denied on the age rule ("usually at the two months mark
  we consider a project mature enough"); when the author quoted Flathub's
  policy back, the reply was "I am the Senate." omapak picks it up. Manifest
  from that PR unchanged.
