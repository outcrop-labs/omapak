app-id: net.mccompanion.MCCompanion
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: MCCompanion

finish-args:
  # Wayland + X11 display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # OpenGL
  - --device=dri
  # Network access (server pinger, wiki, Firebase)
  - --share=network
  # Allow connectivity_plus to communicate with NetworkManager via System D-Bus
  - --system-talk-name=org.freedesktop.NetworkManager
  # Grant access to host Documents folder
  - --filesystem=xdg-documents

modules:
  - name: zenity
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/zenity/4.0/zenity-4.0.1.tar.xz
        sha256: 0c2f537813b10f728470d9d05d6c95713db2512f9c95096e1e85b1a6739605e6
  - name: MCCompanion
    buildsystem: simple
    build-commands:
      # Install the pre-built Flutter bundle produced by 'flutter build linux --release'
      - install -Dm755 MCCompanion /app/bin/MCCompanion
      - cp -r lib /app/bin/lib
      - cp -r data /app/bin/data
      # Desktop entry
      - install -Dm644 net.mccompanion.MCCompanion.desktop /app/share/applications/net.mccompanion.MCCompanion.desktop
      # App icon (256×256 PNG)
      - install -Dm644 net.mccompanion.MCCompanion.png /app/share/icons/hicolor/256x256/apps/net.mccompanion.MCCompanion.png
      # AppStream metainfo
      - install -Dm644 net.mccompanion.MCCompanion.metainfo.xml /app/share/metainfo/net.mccompanion.MCCompanion.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/MCCORG/MCCompanion/releases/download/v5.2.0/MCCompanion-linux-x64.tar.gz
        sha256: d03cd518bee7334b632f9d4fe492595308a987f88b137c55d47e6553cbbf73dd
        x-checker-data:
          type: json
          url: https://api.github.com/repos/MCCORG/MCCompanion/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "MCCompanion-linux-x64.tar.gz") |
            .browser_download_url
          is-main-source: true
      # Vendored rather than fetched from the app's `main` branch. These three
      # are the submission's own packaging metadata, and pulling them live
      # made the build depend on a branch omapak does not control — the same
      # shape that took io.github.alinur1.LocalPDF_Studio down when its asset
      # repo was deleted. Byte-for-byte the files the previous sha256s pinned,
      # apart from the developer id in the metainfo (upstream's failed
      # appstreamcli validation; see the note in that file).
      #
      # The payload archive above keeps its checker, so release bumps still
      # land automatically — and now the metainfo they update is this one,
      # instead of a copy that drifted four versions behind what was shipping.
      - type: file
        path: net.mccompanion.MCCompanion.metainfo.xml
      - type: file
        path: net.mccompanion.MCCompanion.desktop
      - type: file
        path: net.mccompanion.MCCompanion.png
