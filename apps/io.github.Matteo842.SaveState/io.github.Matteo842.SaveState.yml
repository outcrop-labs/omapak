app-id: io.github.Matteo842.SaveState
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: SaveState-wrapper

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-config:rw
  - --filesystem=xdg-data:rw
  - --filesystem=xdg-documents:rw
  - --filesystem=~/.steam:rw
  - --filesystem=~/.local/share/Steam:rw
  - --filesystem=~/.var/app/com.valvesoftware.Steam:rw
  - --filesystem=~/snap:ro

modules:
  - name: savestate
    buildsystem: simple
    build-commands:
      # 1. Creazione cartelle standard
      - mkdir -p /app/bin /app/share/applications /app/share/icons/hicolor/256x256/apps
        /app/share/doc/savestate

      # 2. Installazione eseguibile (estrae dal tar.gz scaricato)
      # Nota: Sostituisci 'SaveState.AppImage' col nome esatto che c'è nel tar.gz
      - cp SaveState.AppImage /app/bin/SaveState-bin
      - chmod +x /app/bin/SaveState-bin

      # 3. Installazione Documentazione e Licenza
      - cp README.md LICENSE /app/share/doc/savestate/ || true

      # 4. Wrapper per evitare errori FUSE
      - |
        cat <<EOF > /app/bin/SaveState-wrapper
        #!/bin/sh
        exec /app/bin/SaveState-bin --appimage-extract-and-run "\$@"
        EOF
      - chmod +x /app/bin/SaveState-wrapper

      # 5. Icona e Menu
      - cp io.github.Matteo842.SaveState.png /app/share/icons/hicolor/256x256/apps/
      - |
        cat <<EOF > /app/share/applications/io.github.Matteo842.SaveState.desktop
        [Desktop Entry]
        Version=1.0
        Type=Application
        Name=SaveState
        Comment=Save State Manager
        Exec=SaveState-wrapper
        Icon=io.github.Matteo842.SaveState
        Categories=Utility;Game;
        Terminal=false
        EOF
    sources:
      - type: archive
        # LINK DIRETTO: Aggiornalo ogni volta che fai una nuova release
        url: https://github.com/Matteo842/SaveState/releases/download/v3.2.1/SaveState_v3.2.1_Linux.tar.xz
        # SHA256: Importante per la sicurezza (Flathub lo esige)
        sha256: 7b38b9da0d5d7d7067b66727adccc607a3cc9e49ca7d645e5ff14abcea0354ce
        # v3.0 renamed the asset to SaveState_v<version>_Linux.tar.xz; the
        # checker will carry the jump (and the judge validates the repack).
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Matteo842/SaveState/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/Matteo842/SaveState/releases/download/v"
            + $version + "/SaveState_v" + $version + "_Linux.tar.xz"'
          is-main-source: true
      - type: file
        path: icon.png
        dest-filename: io.github.Matteo842.SaveState.png
      - type: file
        path: io.github.Matteo842.SaveState.metainfo.xml
