submitter: jon
source_repo: https://github.com/storytold/designcraft
summary: Lay out magazines, books and print documents
license: MIT OR Apache-2.0
homepage: https://getartcraft.com/apps/designcraft
tags: [graphics, publishing, layout]
description: >-
  DesignCraft is a page-layout application for magazines, books and print
  work, part of the ArtCraft Crafting Apps: a clean-room suite written in
  Rust by Learning Machines LLC.

  Packaged from upstream's release tarball at v0.4.0
  (designcraft-0.4.0-linux-x86_64.tar.gz and the aarch64 build), the same
  artifact their own single-file .flatpak is built from, using their own
  bundle manifest unchanged. x-checker-data tracks the GitHub release
  feed, so a new upstream tag arrives here as an automatic version-bump PR
  and is judged like any other submission.
