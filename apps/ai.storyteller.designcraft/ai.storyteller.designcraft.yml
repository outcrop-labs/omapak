# DesignCraft for omapak, repackaged from upstream's own release tarball.
#
# storytold/designcraft ships a flatpak-builder manifest and a full set of release
# artifacts for every tag, including a single-file .flatpak built by
# packaging/linux/flatpak/ai.storyteller.designcraft.bundle.yml. That bundle
# manifest repackages the release's Linux tarball instead of compiling Rust
# inside flatpak-builder; this manifest is that same file, so what omapak ships
# is byte-for-byte the binaries upstream published.
#
# Everything below — runtime, command, finish-args, install steps — is
# upstream's and is meant to stay identical to their bundle manifest. The one
# omapak-side change is the source: the tarball per arch, pinned by sha256 and
# annotated with x-checker-data, so update-apps.yml
# (flatpak-external-data-checker) bumps the version, URL and digest by itself
# when upstream tags a release and opens a PR that goes through the judge.
#
# The installed metainfo is the one inside the tarball, where upstream's
# package.sh has already substituted the release's version and date. The copy
# in this directory is what the judge lints and the site catalog reads.
id: ai.storyteller.designcraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: designcraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for egui's renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save, Place and Export go through the file-chooser portal (rfd's xdg-portal backend)
  # and drag-and-drop through the document portal, so picked files work anywhere without broad
  # filesystem access. Documents and Pictures are granted so files passed by path (the command
  # line, Open Recent, linked images placed in a layout) work in the usual places.
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  # Deliberately not granted: network (the optional --control server listens on 127.0.0.1 in
  # the sandbox; `flatpak override --user --share=network ai.storyteller.designcraft` exposes it
  # to host agents) and home/host filesystem access.
modules:
  - name: designcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/designcraft /app/bin/designcraft
      - install -Dm755 bin/designcraft-cli /app/bin/designcraft-cli
      - install -Dm644 share/applications/ai.storyteller.designcraft.desktop /app/share/applications/ai.storyteller.designcraft.desktop
      - install -Dm644 share/mime/packages/ai.storyteller.designcraft.xml /app/share/mime/packages/ai.storyteller.designcraft.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/ai.storyteller.designcraft.metainfo.xml /app/share/metainfo/ai.storyteller.designcraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/designcraft /app/share/doc/
    sources:
      - type: archive
        url: https://github.com/storytold/designcraft/releases/download/v0.4.0/designcraft-0.4.0-linux-x86_64.tar.gz
        sha256: 4c0b68c0dc62081e455bf8d60dd54f022ff1624359d5e10d06ca2b18d73d4bb3
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/storytold/designcraft/releases/latest
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: '"https://github.com/storytold/designcraft/releases/download/v" + $version + "/designcraft-" + $version + "-linux-x86_64.tar.gz"'
          is-main-source: true
      - type: archive
        url: https://github.com/storytold/designcraft/releases/download/v0.4.0/designcraft-0.4.0-linux-aarch64.tar.gz
        sha256: 1b5b9056959ada5290aa2cdaad850748c9f9f09a1c3b4136908bab996b2bb45c
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/storytold/designcraft/releases/latest
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: '"https://github.com/storytold/designcraft/releases/download/v" + $version + "/designcraft-" + $version + "-linux-aarch64.tar.gz"'
