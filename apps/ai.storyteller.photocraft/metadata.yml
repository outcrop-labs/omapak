submitter: jon
source_repo: https://github.com/storytold/photocraft
summary: Edit photos and layered Photoshop documents
license: MIT OR Apache-2.0
homepage: https://getartcraft.com/apps/photocraft
tags: [graphics, photography, editor]
description: >-
  PhotoCraft is a layered raster image editor that reads and writes PSD
  and PSB, part of the ArtCraft Crafting Apps: a clean-room suite written
  in Rust by Learning Machines LLC.

  Packaged from upstream's release tarball at v0.5.0
  (photocraft-0.5.0-linux-x86_64.tar.gz and the aarch64 build), the same
  artifact their own single-file .flatpak is built from, using their own
  bundle manifest unchanged. x-checker-data tracks the GitHub release
  feed, so a new upstream tag arrives here as an automatic version-bump PR
  and is judged like any other submission.
