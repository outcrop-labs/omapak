submitter: brdweb
source_repo: https://github.com/brdweb/ma-tui
summary: Terminal controller and local speaker for Music Assistant
description: >-
  Builds ma-tui from source (Rust/Cargo, vendored via cargo-sources.json) at
  tag v1.1.1, targeting Music Assistant 2.10.5. Two extra modules: alsa-lib
  (headers/pkg-config for alsa-sys; its shared libraries/config are removed
  after compilation to use the platform's runtime library and plugin paths) and
  libsecret built with -Dcrypto=disabled (secret-tool only, plain D-Bus
  Secret Service negotiation, no gcrypt/gnutls module needed).
license: MIT
homepage: https://github.com/brdweb/ma-tui
tags: [terminal, music, audio, music-assistant]
