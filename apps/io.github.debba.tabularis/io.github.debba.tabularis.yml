id: io.github.debba.tabularis
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: tabularis

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
  - --device=dri

modules:
  - name: tabularis
    buildsystem: simple
    build-commands:
      - chmod +x tabularis.AppImage
      - ./tabularis.AppImage --appimage-extract
      - install -Dm755 squashfs-root/usr/bin/tabularis /app/bin/tabularis
      - install -Dm644 squashfs-root/usr/share/applications/tabularis.desktop /app/share/applications/io.github.debba.tabularis.desktop
      - desktop-file-edit --set-key=Icon --set-value=io.github.debba.tabularis /app/share/applications/io.github.debba.tabularis.desktop
      - desktop-file-edit --set-key=Categories --set-value="Development;Database;"
        /app/share/applications/io.github.debba.tabularis.desktop
      - install -Dm644 squashfs-root/usr/share/icons/hicolor/32x32/apps/tabularis.png
        /app/share/icons/hicolor/32x32/apps/io.github.debba.tabularis.png
      - install -Dm644 squashfs-root/usr/share/icons/hicolor/64x64/apps/tabularis.png
        /app/share/icons/hicolor/64x64/apps/io.github.debba.tabularis.png
      - install -Dm644 squashfs-root/usr/share/icons/hicolor/128x128/apps/tabularis.png
        /app/share/icons/hicolor/128x128/apps/io.github.debba.tabularis.png
      - install -Dm644 squashfs-root/usr/share/icons/hicolor/512x512/apps/tabularis.png
        /app/share/icons/hicolor/512x512/apps/io.github.debba.tabularis.png
      - install -Dm644 io.github.debba.tabularis.metainfo.xml /app/share/metainfo/io.github.debba.tabularis.metainfo.xml
    sources:
      - type: file
        url: https://github.com/debba/tabularis/releases/download/v0.32.0/tabularis_0.32.0_amd64.AppImage
        sha256: b83d424e778c4e4bade68c49e741d2d515dae5a9838931ccde4f4aa2d5b0a3d0
        dest-filename: tabularis.AppImage
        x-checker-data:
          type: json
          url: https://api.github.com/repos/debba/tabularis/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/debba/tabularis/releases/download/v" + $version
            + "/tabularis_" + $version + "_amd64.AppImage"'
          is-main-source: true
      - type: file
        path: io.github.debba.tabularis.metainfo.xml
