id: com.kesomannen.gale

runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk

command: gale
finish-args:
  - --filesystem=home
  - --talk-name=org.freedesktop.Flatpak

  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11

rename-desktop-file: Gale.desktop
rename-icon: gale

modules:
  - name: gale
    buildsystem: simple
    build-commands:
      - chmod +x gale.AppImage
      - ./gale.AppImage --appimage-extract

      - |
        desktop-file-edit \
          --set-icon="$FLATPAK_ID" \
          --set-key="StartupNotify" --set-value="true" \
          "squashfs-root/usr/share/applications/Gale.desktop"

      - mkdir -p "$FLATPAK_DEST"/{bin,lib,share}
      - install -Dm644 squashfs-root/usr/lib/libbz2.so.1.0 "$FLATPAK_DEST"/lib/libbz2.so.1.0
      - cp -r squashfs-root/usr/share/{applications,icons} "$FLATPAK_DEST"/share/
      - install -Dm755 squashfs-root/usr/bin/gale "$FLATPAK_DEST"/bin/gale
      - install -Dm644 com.kesomannen.gale.metainfo.xml "$FLATPAK_DEST"/share/metainfo/com.kesomannen.gale.metainfo.xml

    sources:
      - type: file
        path: com.kesomannen.gale.metainfo.xml

      - type: file
        url: https://github.com/Kesomannen/gale/releases/download/1.23.3/Gale_1.23.3_amd64.AppImage
        dest-filename: gale.AppImage
        sha256: d2b035e4a4a5b8d77590353b9f7448b3ef5bcbf7668ef335e72e5e45716ac01d
        only-arches: [x86_64]
        # Lets update-apps.yml (flatpak-external-data-checker) keep this
        # pinned to the latest release automatically. Gale tags carry no
        # v prefix and the asset embeds the version twice.
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Kesomannen/gale/releases/latest
          version-query: .tag_name
          url-query: '"https://github.com/Kesomannen/gale/releases/download/" + $version
            + "/Gale_" + $version + "_amd64.AppImage"'
