submitter: jon
source_repo: https://github.com/storytold/cadcraft
summary: Draft, dimension and plot 2D drawings
license: MIT OR Apache-2.0
homepage: https://getartcraft.com/apps/cadcraft
tags: [graphics, cad, engineering]
description: >-
  CADCraft is a 2D drafting application with dimensioning and plotting,
  part of the ArtCraft Crafting Apps: a clean-room suite written in Rust
  by Learning Machines LLC.

  Packaged from upstream's release tarball at v0.3.0
  (cadcraft-0.3.0-linux-x86_64.tar.gz and the aarch64 build), the same
  artifact their own single-file .flatpak is built from, using their own
  bundle manifest unchanged. x-checker-data tracks the GitHub release
  feed, so a new upstream tag arrives here as an automatic version-bump PR
  and is judged like any other submission.
