# VectorCraft for omapak, repackaged from upstream's own release tarball.
#
# storytold/vectorcraft ships a flatpak-builder manifest and a full set of release
# artifacts for every tag, including a single-file .flatpak built by
# packaging/linux/flatpak/ai.storyteller.vectorcraft.bundle.yml. That bundle
# manifest repackages the release's Linux tarball instead of compiling Rust
# inside flatpak-builder; this manifest is that same file, so what omapak ships
# is byte-for-byte the binaries upstream published.
#
# Everything below — runtime, command, finish-args, install steps — is
# upstream's and is meant to stay identical to their bundle manifest. The one
# omapak-side change is the source: the tarball per arch, pinned by sha256 and
# annotated with x-checker-data, so update-apps.yml
# (flatpak-external-data-checker) bumps the version, URL and digest by itself
# when upstream tags a release and opens a PR that goes through the judge.
#
# The installed metainfo is the one inside the tarball, where upstream's
# package.sh has already substituted the release's version and date. The copy
# in this directory is what the judge lints and the site catalog reads.
id: ai.storyteller.vectorcraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: vectorcraft
finish-args:
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save dialogs use the file-chooser portal (rfd), and drag-and-drop uses the document
  # portal, so broad filesystem access isn't needed. Pictures is granted for opening files by
  # path from the command line.
  - --filesystem=xdg-pictures
  # Deliberately not granted: network (the optional --control server listens on 127.0.0.1 in
  # the sandbox; `flatpak override --user --share=network ai.storyteller.vectorcraft` exposes it
  # to host agents) and home/host filesystem access.
modules:
  - name: vectorcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/vectorcraft /app/bin/vectorcraft
      - install -Dm755 bin/vectorcraft-cli /app/bin/vectorcraft-cli
      - install -Dm644 share/applications/ai.storyteller.vectorcraft.desktop /app/share/applications/ai.storyteller.vectorcraft.desktop
      - install -Dm644 share/mime/packages/ai.storyteller.vectorcraft.xml /app/share/mime/packages/ai.storyteller.vectorcraft.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/ai.storyteller.vectorcraft.metainfo.xml /app/share/metainfo/ai.storyteller.vectorcraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/vectorcraft /app/share/doc/
    sources:
      - type: archive
        url: https://github.com/storytold/vectorcraft/releases/download/v0.6.0/vectorcraft-0.6.0-linux-x86_64.tar.gz
        sha256: 48b59a1db5a454e9b06d3bb2c22b5a01f86be47e9eb43c8c510768407803f1f7
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/storytold/vectorcraft/releases/latest
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: '"https://github.com/storytold/vectorcraft/releases/download/v" + $version + "/vectorcraft-" + $version + "-linux-x86_64.tar.gz"'
          is-main-source: true
      - type: archive
        url: https://github.com/storytold/vectorcraft/releases/download/v0.6.0/vectorcraft-0.6.0-linux-aarch64.tar.gz
        sha256: 65fd4a2685c6fb5b55a91c968e78856438712f2bb31306ea8677e706aff1ac5a
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/storytold/vectorcraft/releases/latest
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: '"https://github.com/storytold/vectorcraft/releases/download/v" + $version + "/vectorcraft-" + $version + "-linux-aarch64.tar.gz"'
