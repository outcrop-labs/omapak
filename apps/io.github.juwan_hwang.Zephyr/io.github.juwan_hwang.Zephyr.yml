app-id: io.github.juwan_hwang.Zephyr
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: zephyr

finish-args:
  # Network & IPC
  - --share=network
  - --share=ipc
  # Display (X11 & Wayland)
  - --socket=fallback-x11
  - --socket=wayland
  # Tray notification support
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: zephyr
    buildsystem: simple
    build-commands:
      - ar x package.deb
      - tar xf data.tar.* -C /app/
      # Install desktop file & metadata
      - install -Dm644 /app/usr/share/applications/Zephyr.desktop /app/share/applications/io.github.juwan_hwang.Zephyr.desktop
      - sed -i 's/^Icon=.*/Icon=io.github.juwan_hwang.Zephyr/' /app/share/applications/io.github.juwan_hwang.Zephyr.desktop
      - sed -i 's/^Exec=.*/Exec=zephyr/' /app/share/applications/io.github.juwan_hwang.Zephyr.desktop
      - sed -i 's/^Categories=.*/Categories=Network;Utility;/' /app/share/applications/io.github.juwan_hwang.Zephyr.desktop
      - install -Dm644 io.github.juwan_hwang.Zephyr.metainfo.xml /app/share/metainfo/io.github.juwan_hwang.Zephyr.metainfo.xml
      # Export app icons with matching Flatpak ID
      - install -Dm644 /app/usr/share/icons/hicolor/32x32/apps/Zephyr.png /app/share/icons/hicolor/32x32/apps/io.github.juwan_hwang.Zephyr.png
      - install -Dm644 /app/usr/share/icons/hicolor/128x128/apps/Zephyr.png /app/share/icons/hicolor/128x128/apps/io.github.juwan_hwang.Zephyr.png
      - install -Dm644 /app/usr/share/icons/hicolor/256x256@2/apps/Zephyr.png /app/share/icons/hicolor/256x256@2/apps/io.github.juwan_hwang.Zephyr.png
      # Symlink binary to /app/bin/zephyr
      - mkdir -p /app/bin
      - ln -sf /app/usr/bin/Zephyr /app/bin/zephyr
    sources:
      - type: file
        url: https://github.com/Juwan-Hwang/Zephyr/releases/download/v2.5.0/Zephyr_2.5.0_linux-x86_64-full.deb
        sha256: 5f103f38a9aac9265a8d7cab5290e2fbc596f7a873663abad3c76619ea47d88c
        dest-filename: package.deb
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Juwan-Hwang/Zephyr/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/Juwan-Hwang/Zephyr/releases/download/v" + $version + "/Zephyr_" + $version + "_linux-x86_64-full.deb"'
      - type: file
        url: https://github.com/Juwan-Hwang/Zephyr/releases/download/v2.5.0/Zephyr_2.5.0_linux-aarch64-full.deb
        sha256: b556986af44a939da31f9a16314efa3ac554f4a1298b6e96e69f079b0fec99fc
        dest-filename: package.deb
        only-arches:
          - aarch64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Juwan-Hwang/Zephyr/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/Juwan-Hwang/Zephyr/releases/download/v" + $version + "/Zephyr_" + $version + "_linux-aarch64-full.deb"'
      - type: file
        path: io.github.juwan_hwang.Zephyr.metainfo.xml
