# DeckCraft for omapak, repackaged from upstream's own release tarball.
#
# storytold/deckcraft ships a flatpak-builder manifest and a full set of release
# artifacts for every tag, including a single-file .flatpak built by
# packaging/linux/flatpak/ai.storyteller.deckcraft.bundle.yml. That bundle
# manifest repackages the release's Linux tarball instead of compiling Rust
# inside flatpak-builder; this manifest is that same file, so what omapak ships
# is byte-for-byte the binaries upstream published.
#
# Everything below — runtime, command, finish-args, install steps — is
# upstream's and is meant to stay identical to their bundle manifest. The one
# omapak-side change is the source: the tarball per arch, pinned by sha256 and
# annotated with x-checker-data, so update-apps.yml
# (flatpak-external-data-checker) bumps the version, URL and digest by itself
# when upstream tags a release and opens a PR that goes through the judge.
#
# The installed metainfo is the one inside the tarball, where upstream's
# package.sh has already substituted the release's version and date. The copy
# in this directory is what the judge lints and the site catalog reads.
id: ai.storyteller.deckcraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: deckcraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Sound for audio and video in slide shows (cpal over ALSA, routed to PulseAudio/PipeWire by
  # the runtime's ALSA plugin).
  - --socket=pulseaudio
  # Open/Save dialogs go through the file-chooser portal (rfd) and drag-and-drop through the
  # document portal, so picked files work anywhere without broad filesystem access. Documents is
  # granted so decks passed by path (the command line, Open Recent) work in the usual place.
  - --filesystem=xdg-documents
  # Deliberately not granted: network (the optional --control server listens on 127.0.0.1 in
  # the sandbox; `flatpak override --user --share=network ai.storyteller.deckcraft` exposes it to
  # host agents) and home/host filesystem access.
modules:
  - name: deckcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/deckcraft /app/bin/deckcraft
      - install -Dm755 bin/deckcraft-cli /app/bin/deckcraft-cli
      - install -Dm644 share/applications/ai.storyteller.deckcraft.desktop /app/share/applications/ai.storyteller.deckcraft.desktop
      # .deckcraft; the runtime's shared-mime-info already knows the PowerPoint types.
      - install -Dm644 share/mime/packages/ai.storyteller.deckcraft.xml /app/share/mime/packages/ai.storyteller.deckcraft.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/ai.storyteller.deckcraft.metainfo.xml /app/share/metainfo/ai.storyteller.deckcraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/deckcraft /app/share/doc/
    sources:
      - type: archive
        url: https://github.com/storytold/deckcraft/releases/download/v0.3.0/deckcraft-0.3.0-linux-x86_64.tar.gz
        sha256: 179d6ce47401ba37c233c3fc0a18034126aed81ac36a49c4df6ecdaca9b5ab7f
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/storytold/deckcraft/releases/latest
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: '"https://github.com/storytold/deckcraft/releases/download/v" + $version + "/deckcraft-" + $version + "-linux-x86_64.tar.gz"'
          is-main-source: true
      - type: archive
        url: https://github.com/storytold/deckcraft/releases/download/v0.3.0/deckcraft-0.3.0-linux-aarch64.tar.gz
        sha256: fe1d936c7e67371aba2e3ed86ffe9bc20720a6e1ff5b0a390c82283bb94c243f
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/storytold/deckcraft/releases/latest
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: '"https://github.com/storytold/deckcraft/releases/download/v" + $version + "/deckcraft-" + $version + "-linux-aarch64.tar.gz"'
