app-id: me.tyrrrz.DiscordChatExporter
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: DiscordChatExporter

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --filesystem=xdg-download
  - --env=DISCORDCHATEXPORTER_SETTINGS_PATH=/var/config/settings.json
  - --env=DISCORDCHATEXPORTER_ALLOW_AUTO_UPDATE=false

modules:
  - name: DiscordChatExporter
    buildsystem: simple

    build-commands:
      - install -d /app/DiscordChatExporter
      - cp -r . /app/DiscordChatExporter/
      - chmod +x /app/DiscordChatExporter/DiscordChatExporter
      - install -d /app/bin
      - ln -s /app/DiscordChatExporter/DiscordChatExporter /app/bin/DiscordChatExporter
      - install -Dm644 me.tyrrrz.DiscordChatExporter.desktop /app/share/applications/me.tyrrrz.DiscordChatExporter.desktop
      - install -Dm644 me.tyrrrz.DiscordChatExporter.metainfo.xml /app/share/metainfo/me.tyrrrz.DiscordChatExporter.metainfo.xml
      - install -Dm644 favicon.png /app/share/icons/hicolor/256x256/apps/me.tyrrrz.DiscordChatExporter.png

    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/Tyrrrz/DiscordChatExporter/releases/download/2.48/DiscordChatExporter.linux-x64.zip
        sha256: aafec3a2020c82a718f89123e864f9e7f9db756530bc8b8505ef7bb074134a61
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Tyrrrz/DiscordChatExporter/releases/latest
          version-query: .tag_name
          url-query: >-
            .assets[] | select(.name == "DiscordChatExporter.linux-x64.zip") | .browser_download_url

      - type: archive
        only-arches: [arm]
        url: https://github.com/Tyrrrz/DiscordChatExporter/releases/download/2.48/DiscordChatExporter.linux-arm.zip
        sha256: f9ab96bf9b6225a145e5380c13b5a7fec79110c4bf391e02111ad784e7f394e4
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Tyrrrz/DiscordChatExporter/releases/latest
          version-query: .tag_name
          url-query: >-
            .assets[] | select(.name == "DiscordChatExporter.linux-arm.zip") | .browser_download_url

      - type: archive
        only-arches: [aarch64]
        url: https://github.com/Tyrrrz/DiscordChatExporter/releases/download/2.48/DiscordChatExporter.linux-arm64.zip
        sha256: e6cd0c31319dddd57e3dbce710f977f95c5b5d71d8966b11ace4d5da698ee3f0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Tyrrrz/DiscordChatExporter/releases/latest
          version-query: .tag_name
          url-query: >-
            .assets[] | select(.name == "DiscordChatExporter.linux-arm64.zip") | .browser_download_url

      - type: file
        path: me.tyrrrz.DiscordChatExporter.desktop

      - type: file
        path: me.tyrrrz.DiscordChatExporter.metainfo.xml

      # The app icon, vendored next to the desktop entry and metainfo rather
      # than fetched. The tag it was pinned to is immutable, but a tag only
      # survives a branch moving — not the repository going away, which is
      # how io.github.alinur1.LocalPDF_Studio's three assets were lost.
      # Byte-for-byte the file the previous sha256 pinned.
      - type: file
        path: me.tyrrrz.DiscordChatExporter.png
        dest-filename: favicon.png
