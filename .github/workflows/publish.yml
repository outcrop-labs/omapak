name: publish

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "omapak.flatpakrepo"
      - "deploy/push-to-r2.py"
      - "deploy/pull-from-r2.py"
      - "deploy/install-runtimes.sh"
      - "deploy/appstreamcli-catchall.sh"
      - "deploy/is-tui-app.sh"
      - "assets/icons/tui.png"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read

# Serialize every summary writer. Concurrent publishes each restore R2
# at their own start and push their own summary — the last one to land
# wins and can drop refs the others added (four merges in 14 minutes
# once left three newly-merged apps out of the live summary). No
# cancel-in-progress: killing a run between the summary and summary.sig
# uploads would break every client.
concurrency:
  group: repo-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore repo refs from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p repo/refs/heads repo/objects repo/refs/remotes repo/refs/mirrors repo/extensions
          printf '[core]\nrepo_version=1\nmode=archive-z2\n' > repo/config
          # rclone's listing of the ~30k-object bucket fails silently; boto3
          # is the proven path for everything R2 in this repo
          pip install -q boto3
          python3 deploy/pull-from-r2.py repo
          echo "existing omapak app refs:"
          ls repo/refs/heads/app/ 2>/dev/null || echo "(none — first run)"
          [ -n "$(ls repo/refs/heads/app/ 2>/dev/null)" ] || \
            echo "::warning::no omapak refs restored — if this is not the first run, the restore failed"

      - name: Drop refs with missing commit objects
        run: |
          # Exporting an app into the live repo regenerates the appstream
          # branch by walking every ref in the repo, and it aborts hard on
          # a ref whose commit object can't be loaded (assertion in
          # _flatpak_repo_generate_appstream, run 35462539327: every build
          # died with signal 6). The flathub merge tolerates pull
          # failures, so refs with no commit object accumulate under
          # refs/mirrors — the summary step only validates refs/heads.
          # Drop them; the next run's flathub merge re-adds whichever
          # pulls succeed, and an omapak app that loses its ref here gets
          # rebuilt below (the skip requires the ref to exist).
          dropped=0
          for reffile in $(find repo/refs -type f); do
            sha=$(cat "$reffile")
            if [ ! -f "repo/objects/${sha:0:2}/${sha:2}.commit" ]; then
              rm -f "$reffile"
              dropped=$((dropped+1))
            fi
          done
          echo "dropped $dropped refs with missing commit objects"

      - name: Cache flatpak builds
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          # v2: the v1 cache carried commit state from pre-R2 local test
          # builds that broke exports
          key: flatpak-builds-v2-${{ runner.os }}-${{ hashFiles('apps/**') }}
          restore-keys: flatpak-builds-v2-

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          # Runtime deps of flatpak-builder 1.4.11 below: it shells out to
          # bsdunzip (.zip sources), appstreamcli compose (export) and
          # eu-strip (debuginfo) — none ship on the runner since the
          # 2026-09 image drift.
          sudo apt-get install -y flatpak ostree \
            libarchive-tools appstream-compose appstream elfutils

      # Same builder as the judge, copied verbatim. apt's 1.4.2 cannot
      # expand bare-string source includes ("modules: [ foo.json ]"),
      # which 1.4.11 accepts — OmaAmp passed the judge and then failed
      # here with "sdk not specified" (2026-09-16). One builder version
      # everywhere ends that drift class. The key carries the Ubuntu
      # release for the same reason as the judge's (see judge.yml).
      - name: Runner OS release
        id: osrel
        run: echo "version=$(. /etc/os-release && echo "$VERSION_ID")" >> "$GITHUB_OUTPUT"
      - name: Cache flatpak-builder 1.4.11
        id: fbcache
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/flatpak-builder
          key: flatpak-builder-1.4.11-ubuntu${{ steps.osrel.outputs.version }}-v1
      - name: Build flatpak-builder 1.4.11
        if: steps.fbcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y meson ninja-build build-essential debugedit \
            libflatpak-dev libcurl4-openssl-dev libyaml-dev libjson-glib-dev libelf-dev
          curl -sL -o /tmp/fb.tar.xz \
            https://github.com/flatpak/flatpak-builder/releases/download/1.4.11/flatpak-builder-1.4.11.tar.xz
          echo "2a5ef4f3eaea86f808aa477e57e65b6f68978eb1c034fafe05bffdebbf1dcd03  /tmp/fb.tar.xz" | sha256sum -c
          tar -C /tmp -xf /tmp/fb.tar.xz
          cd /tmp/flatpak-builder-1.4.11
          sed -i \
            -e "s|find_program('appstreamcli', version: '>= 0.15.0')|find_program('appstreamcli', version: '>= 0.15.0', required: false)|" \
            -e "s|run_command(appstreamcli, \['compose', '--help'\], check: true)|run_command('false', check: false)|" \
            meson.build
          meson setup build --buildtype=release -D docs=disabled -D tests=false
          ninja -C build
          sudo install -m755 build/src/flatpak-builder /usr/local/bin/flatpak-builder
      - name: flatpak-builder version check
        run: flatpak-builder --version

      # Same catchall machinery as the judge (deploy/appstreamcli-catchall.sh):
      # iconless TUI apps get the omapak placeholder at export. The loop
      # below sets OMAPAK_TUI_CATCHALL per app via deploy/is-tui-app.sh.
      - name: Install appstreamcli catchall shim
        run: |
          sudo install -m755 deploy/appstreamcli-catchall.sh /usr/local/bin/appstreamcli
          sudo install -Dm644 assets/icons/tui.png /usr/local/share/omapak/tui.png

      - name: Install runtimes
        run: ./deploy/install-runtimes.sh

      # Commits must be signed: the remote runs gpg-verify=true, so an
      # unsigned app commit fails the client pull even with a signed summary.
      - name: Import signing key
        env:
          OMAPAK_GPG_KEY: ${{ secrets.OMAPAK_GPG_KEY }}
        run: echo "$OMAPAK_GPG_KEY" | gpg --import

      - name: Build changed apps (unchanged keep their published refs)
        id: build
        run: |
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          # Incremental publish. Full rebuilds dominated the run (2h07m
          # of the 2026-09-19 run) because every app re-exported whether
          # or not it changed. The R2 state/last-published marker names
          # the commit of the last fully-successful publish (failed runs
          # never advance it), so git-diffing against it yields exactly
          # the apps that still owe the repo a build.
          build_all=1
          base=""
          if [ -s last-published ]; then
            base=$(cat last-published)
            if git cat-file -e "$base^{commit}" 2>/dev/null; then
              build_all=0
              # Infra that shapes every commit (export flags, catchall
              # icon, repo definition) forces a full rebuild.
              if git diff --name-only "$base" HEAD -- \
                  .github/workflows/publish.yml deploy/ \
                  omapak.flatpakrepo assets/icons/tui.png | grep -q .; then
                build_all=1
                echo "infra changed since $base — full rebuild"
              fi
            else
              echo "::warning::marker $base not in history — full rebuild"
            fi
          fi
          changed=""
          if [ "$build_all" = 0 ]; then
            changed=$(git diff --name-only "$base" HEAD -- apps/ | cut -d/ -f2 | sort -u)
            echo "apps changed since $base: ${changed:-<none>}"
          fi
          # Exports target a scratch repo. The live repo can't be an
          # export target: every export regenerates the appstream branch
          # by walking every ref and diffing against the existing branch,
          # and the live appstream ref points at a commit whose tree never
          # fully landed in R2 (missing root dirtree, HTTP 404 — two full
          # runs died on that read, 2026-09-19). Scratch never reads it.
          rm -rf build-repo
          mkdir -p build-repo/objects build-repo/refs/heads build-repo/refs/remotes build-repo/refs/mirrors
          printf '[core]\nrepo_version=1\nmode=archive-z2\n' > build-repo/config
          # Seed every omapak app ref plus its objects (hardlinked) so
          # appstream regeneration covers SKIPPED apps too: xa.appdata
          # lives in commit metadata and icons are small filez — both
          # restored from R2. Flathub mirror refs are not seeded; their
          # metadata-only trees only generate "No appstream data" noise.
          # An omapak app id can also collide with a flathub BRANCH
          # mirror (Vish and Keyoxide carry /stable refs) whose dirtrees
          # never reached the bucket — walking one kills the export
          # (run 35476937549: every app died on Vish's missing dirtree,
          # 404 from the bucket), so seed only refs whose tree metadata
          # reads clean end to end.
          for reffile in $(find repo/refs/heads/app -type f 2>/dev/null); do
            name=$(echo "$reffile" | cut -d/ -f5)
            [ -d "apps/$name" ] || continue
            ref="${reffile#repo/refs/heads/}"
            ostree ls -R --repo=repo "$ref" >/dev/null 2>&1 || continue
            mkdir -p "$(dirname "build-repo/${reffile#repo/}")"
            cp "$reffile" "build-repo/${reffile#repo/}"
          done
          cp -al repo/objects/. build-repo/objects/ 2>/dev/null || cp -a repo/objects/. build-repo/objects/
          failed=""
          built=""
          built_refs=""
          refs_seen=$(find build-repo/refs/heads -type f -exec sha256sum {} + | sort)
          for app in apps/*/; do
            name=$(basename "$app")
            # Unchanged since the last good publish AND its published ref
            # survived the ghost purge — a purged ref means the app owes
            # the repo a build regardless of the marker.
            if [ "$build_all" = 0 ] && ! grep -qx "$name" <<<"$changed" \
               && [ -n "$(find repo/refs/heads/app/"$name" -type f 2>/dev/null)" ]; then
              continue
            fi
            # Pick the app-id-named manifest like the judge does
            # (omapak-core find_manifest): a plain find grabs whichever
            # .json lands first, which fed flatpak-builder a
            # python3-requirements.json fragment as OmaAmp's manifest
            # ("Failed to init: sdk not specified", 2026-09-16).
            manifest=""
            for cand in "$name.yml" "$name.yaml" "$name.json"; do
              [ -f "$app/$cand" ] && manifest="$app/$cand" && break
            done
            if [ -z "$manifest" ]; then
              manifest=$(find "$app" -maxdepth 1 \( -name '*.yml' -o -name '*.yaml' -o -name '*.json' \) \
                ! -name 'metadata.yml' ! -name 'flathub.json' \
                ! -name '*-sources.json' ! -name '*-dependencies.json' | head -1)
            fi
            [ -n "$manifest" ] || continue
            echo "::group::build $name"
            # TUI apps (metadata.yml tags) may ship no icon — the
            # appstreamcli catchall shim only injects when this is 1.
            if ./deploy/is-tui-app.sh "$app"; then
              export OMAPAK_TUI_CATCHALL=1
            else
              export OMAPAK_TUI_CATCHALL=0
            fi
            # The judge caps builds at OMAPAK_BUILD_TIMEOUT_SECS (default
            # 5400); publish's bare flatpak-builder had no cap, so a hung
            # build stalls the whole serialized repo-publish queue forever
            # (2026-09-17: a silent 2h build with no heartbeat blocked
            # every app behind it). Same default, env-overridable.
            if timeout --kill-after=60 "${OMAPAK_PUBLISH_TIMEOUT_SECS:-5400}" \
                flatpak-builder --force-clean --disable-rofiles-fuse --user \
                --gpg-sign="$keyid" \
                --repo=build-repo ".flatpak-builder/$name" "$manifest" >"/tmp/build-$name.log" 2>&1; then
              tail -5 "/tmp/build-$name.log"
              # Track the refs this export wrote for the re-stamp pass —
              # app refs only; the appstream branches are restamped
              # explicitly below. The grep must not fail the step when
              # the diff is empty: a fully-cached rebuild can reproduce
              # the published commit bit-for-bit, leaving the seeded ref
              # unchanged (E131Receiver, run 35492584728 — one empty
              # diff killed the step under bash -e).
              refs_now=$(find build-repo/refs/heads -type f -exec sha256sum {} + | sort)
              built_refs="$built_refs $(comm -13 <(echo "$refs_seen") <(echo "$refs_now") | awk '{print $2}' | sed 's|^build-repo/refs/heads/||' | grep '^app/' || true)"
              refs_seen="$refs_now"
              built="$built $name"
            else
              rc=$?
              if [ "$rc" -eq 124 ]; then
                echo "flatpak-builder exceeded OMAPAK_PUBLISH_TIMEOUT_SECS (${OMAPAK_PUBLISH_TIMEOUT_SECS:-5400}s) and was killed" >> "/tmp/build-$name.log"
              fi
              tail -30 "/tmp/build-$name.log"
              # Per-app failures are tolerated (keep the last-good ref,
              # gate at the end) — but repo-level corruption kills every
              # export identically, and tolerating it means 2h of doomed
              # builds before the red X (2026-09-19: two full runs, all
              # 40 apps, same appstream assertion). Fail the run the
              # first time an export dies of it.
              if grep -qE 'flatpak:ERROR|No such metadata object|Export failed: Child process killed by signal' \
                  "/tmp/build-$name.log"; then
                echo "::error::$name failed with a repo-level export error — aborting instead of building the rest into the same wall"
                exit 1
              fi
              failed="$failed $name"
            fi
            echo "::endgroup::"
          done
          # Fold this run's refs — built apps plus the freshly regenerated
          # appstream branches — into the live repo. pull-local never
          # regenerates anything, so the broken historical appstream ref
          # is simply replaced by the scratch branch.
          ostree pull-local --repo=repo build-repo
          # flatpak-builder 1.4.11 has no --timestamp passthrough: it shells
          # out to a bare `flatpak build-export`, which stamps the commit
          # with the appstream file's mtime. The .flatpak-builder cache can
          # keep that mtime older than commits clients already hold, and
          # flatpak then refuses the pull ("Update is older than current
          # version", 2026-09-19: talaria + sonix both hit it). Re-stamp
          # every ref written this run — app refs and the appstream
          # branches — with the current time so each publish is strictly
          # newer than anything installed. --force: a same-repo restamp
          # looks like a no-op without it.
          if [ -n "$built_refs" ]; then
            for ref in $built_refs appstream/x86_64 appstream2/x86_64; do
              [ -f "repo/refs/heads/$ref" ] || continue
              flatpak build-commit-from --timestamp=NOW --force --no-update-summary \
                --gpg-sign="$keyid" --src-repo=repo repo "$ref"
            done
          fi
          # Recorded for the post-push gate: failed apps keep their last
          # good ref in the repo (restored from R2), the rest publish, and
          # the run still goes red so nobody misses it.
          rt_failed=$(cat /tmp/rt-failed.txt 2>/dev/null || true)
          echo "FAILED_BUILDS=$failed" >> "$GITHUB_ENV"
          echo "BUILT_APPS=$built" >> "$GITHUB_ENV"
          # The R2 marker advances only when every app and runtime
          # succeeded — otherwise the next run re-attempts the failures.
          if [ -z "$failed" ] && [ -z "$rt_failed" ]; then
            echo "OMAPAK_ADVANCE_MARKER=1" >> "$GITHUB_ENV"
          fi

      - name: Extract icons from builds (non-blocking)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Extract the hicolor app icon from each built app and push to
          # R2; skipped apps keep the icon their last build pushed. Some
          # apps install their icon under a different name (the OpenRGB
          # plugins use openrgb-*-plugin.png), so when the app-id match
          # misses, take the largest PNG the app itself shipped.
          for app in apps/*/; do
            name=$(basename "$app")
            case " ${BUILT_APPS:-} " in *" $name "*) ;; *) continue ;; esac
            icon=$(find ".flatpak-builder/$name/files/share/icons/hicolor" -name "$name*" -type f 2>/dev/null | sort -r | head -1)
            [ -n "$icon" ] || icon=$(find ".flatpak-builder/$name/files/share/icons/hicolor" -name '*.png' -type f -printf '%s %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
            [ -n "$icon" ] || continue
            echo "icon for $name: $icon"
            curl -s -o /dev/null -w "  push: %{http_code}\n" \
              -X PUT "https://api.cloudflare.com/client/v4/accounts/7396d8475acc6c87ef13e97a617712f1/r2/buckets/omapak-repo/objects/icons/$name.png" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --data-binary "@$icon" || echo "  icon push failed for $name"
          done


      # No flathub mirror step. dl.flathub.org rate-limits bulk object
      # fetching by IP — GitHub runner pools, Cloudflare Workers, even
      # residential IPs under load (2026-09-20: three full runs, zero
      # progress, 13.5k extension refs never mirrorable). Clients get
      # flathub objects the moment they need them via the worker's 302
      # fallback instead (worker/src/lib.rs, #181), and the summary's
      # flathub refs stay as last mirrored in R2. Freshness of those
      # refs moves to the summary composer; until it lands they are
      # stale-but-valid (old commits stay installable).
      - name: Sign combined summary
        env:
          OMAPAK_GPG_KEY: ${{ secrets.OMAPAK_GPG_KEY }}
        run: |
          echo "$OMAPAK_GPG_KEY" | gpg --import
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          # Refs restored from R2 can point at unreadable commit objects
          # (truncated uploads). Let summary --update name the offender,
          # drop that ref, retry — provenance checks proved unreliable.
          ok=""
          for attempt in $(seq 1 20); do
            if ostree summary --update --repo=repo --gpg-sign="$keyid" 2>/tmp/summary.err; then ok=1; break; fi
            ghost=$(grep -oE '[0-9a-f]{64}\.commit' /tmp/summary.err | head -1 | cut -d. -f1)
            if [ -z "$ghost" ]; then cat /tmp/summary.err; exit 1; fi
            echo "summary retry $attempt: dropping ref to unreadable commit $ghost"
            # summary collects heads + remotes (and mirrors feed heads),
            # so hunt the whole refs tree
            grep -rl "^$ghost$" repo/refs 2>/dev/null | while read -r f; do echo "  removing $f"; rm -f "$f"; done
          done
          [ "$ok" = 1 ] || { echo "summary never succeeded"; exit 1; }

      - name: Push to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          pip install -q boto3
          python3 deploy/push-to-r2.py repo

      # The site reads data/catalog.json from R2 — without this step it
      # only ever changed when the generator was run by hand (it sat
      # stale for three days while apps merged).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild site catalog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install --prefix web --no-audit --no-fund yaml
          node web/scripts/push-catalog.mjs

      # Gate comes after the push: the repo serves last-good refs for
      # failed apps while the red X makes the failure impossible to miss.
      - name: Fail on build/runtime failures
        if: always()
        run: |
          rt_failed=$(cat /tmp/rt-failed.txt 2>/dev/null || true)
          if [ -n "${FAILED_BUILDS:-}" ] || [ -n "$rt_failed" ]; then
            echo "::error::build failures:${FAILED_BUILDS:-} runtime failures:$rt_failed"
            exit 1
          fi
