name: publish

on:
  workflow_dispatch:
  workflow_run:
    workflows: [judge]
    types: [completed]
    branches: [main]

permissions:
  contents: write

env:
  RUNTIME: org.freedesktop.Platform
  RUNTIME_VERSION: "24.08"

jobs:
  publish:
    # Only after the report job has landed fresh reports on main.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore OSTree repo from the repo branch
        run: |
          if git ls-remote --heads origin repo | grep -q repo; then
            git fetch origin repo --depth=1
            git worktree add wt origin/repo
            mv wt/repo ./repo
          else
            mkdir repo
          fi

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder pipx rclone
          pipx install flatpak-builder-lint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install runtime + SDK
        run: |
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive \
            flathub org.freedesktop.Platform//$RUNTIME_VERSION org.freedesktop.Sdk//$RUNTIME_VERSION

      - name: Build every accepted app into the OSTree repo
        run: |
          for app in apps/*/; do
            [ -f "$app/report.json" ] || { echo "::warning::$app has no report.json — skipping"; continue; }
            manifest=$(find "$app" -maxdepth 1 -name '*.json' -o -maxdepth 1 -name '*.yml' | head -1)
            [ -n "$manifest" ] || { echo "::warning::$app has no manifest — skipping"; continue; }
            echo "::group::build $app"
            flatpak-builder --force-clean --disable-rofiles-fuse --repo=repo "build/$(basename "$app")" "$manifest"
            echo "::endgroup::"
          done

      - name: Sign the repo summary
        env:
          OMAPAK_GPG_KEY: ${{ secrets.OMAPAK_GPG_KEY }}
        run: |
          echo "$OMAPAK_GPG_KEY" | gpg --import
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          flatpak build-update-repo --generate-static-deltas --gpg-sign="$keyid" repo

      - name: Commit repo state to the repo branch
        run: |
          git config user.name "omapak-publish"
          git config user.email "publish@omapak.outcrop.labs"
          git checkout --orphan repo-tmp
          git rm -rf --quiet . 2>/dev/null || true
          cp -r repo/. .
          git add -A
          git commit -m "repo: publish $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:repo --force

      - name: Sync to Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: ./deploy/r2.sh repo
