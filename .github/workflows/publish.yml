name: publish

on:
  push:
    branches: [main]
    paths: ["apps/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore repo refs from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          mkdir -p repo/refs/heads repo/objects repo/refs/remotes repo/refs/mirrors repo/extensions
          printf '[core]\nrepo_version=1\nmode=archive-z2\n' > repo/config
          rclone copy ":s3,provider=Cloudflare,endpoint=\"${R2_ENDPOINT}\":omapak-repo/refs" repo/refs \
            --s3-access-key-id "$R2_ACCESS_KEY_ID" \
            --s3-secret-access-key "$R2_SECRET_ACCESS_KEY" --s3-no-check-bucket 2>/dev/null || true
          rclone copy ":s3,provider=Cloudflare,endpoint=\"${R2_ENDPOINT}\":omapak-repo" repo \
            --s3-access-key-id "$R2_ACCESS_KEY_ID" \
            --s3-secret-access-key "$R2_SECRET_ACCESS_KEY" --s3-no-check-bucket \
            --include "summary*" --include "config" 2>/dev/null || true
          echo "existing omapak app refs:"
          ls repo/refs/heads/app/ 2>/dev/null || echo "(none — first run)"

      - name: Cache flatpak builds
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builds-${{ runner.os }}-${{ hashFiles('apps/**') }}
          restore-keys: flatpak-builds-

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder rclone ostree \
            pkg-config libcairo2-dev libgirepository1.0-dev libglib2.0-dev

      - name: Install runtimes
        run: ./deploy/install-runtimes.sh

      - name: Build all apps (cached, unchanged skip compile)
        run: |
          for app in apps/*/; do
            name=$(basename "$app")
            manifest=$(find "$app" -maxdepth 1 \( -name '*.yml' -o -name '*.yaml' -o -name '*.json' \) ! -name 'metadata.yml' ! -name 'flathub.json' | head -1)
            [ -n "$manifest" ] || continue
            echo "::group::build $name"
            flatpak-builder --force-clean --disable-rofiles-fuse --user \
              --repo=repo ".flatpak-builder/$name" "$manifest" 2>&1 | tail -5
            echo "::endgroup::"
          done

      - name: Extract icons from builds (non-blocking)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Extract the hicolor app icon from each built app and push to R2
          for app in apps/*/; do
            name=$(basename "$app")
            icon=$(find ".flatpak-builder/$name/files/share/icons/hicolor" -name "$name*" -type f 2>/dev/null | sort -r | head -1)
            [ -n "$icon" ] || continue
            echo "icon for $name: $icon"
            curl -s -o /dev/null -w "  push: %{http_code}\n" \
              -X PUT "https://api.cloudflare.com/client/v4/accounts/7396d8475acc6c87ef13e97a617712f1/r2/buckets/omapak-repo/objects/icons/$name.png" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --data-binary "@$icon" || echo "  icon push failed for $name"
          done


      - name: Sign combined summary
        env:
          OMAPAK_GPG_KEY: ${{ secrets.OMAPAK_GPG_KEY }}
        run: |
          echo "$OMAPAK_GPG_KEY" | gpg --import
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          ostree summary --update --repo=repo --gpg-sign="$keyid"

      - name: Push to R2 via Cloudflare API
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: ./deploy/push-to-r2.sh repo
