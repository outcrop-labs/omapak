name: judge-report

# Phase 2: agent rubric + PR comment. Triggered by judge.yml completing, so
# it runs on the default branch context and gets secrets. GitHub rejects
# workflows that workflow_run-reference themselves, hence the split.
on:
  workflow_run:
    workflows: [judge]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  judge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PR app data as DATA only, never executed. The judge binary is built
      # from main (trusted).
      - name: Check out PR app data (data only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: apps
          path: pr-apps

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          name: judge-partial
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run judge stage on partial reports
        env:
          OMAPAK_LLM_BASE_URL: ${{ secrets.OMAPAK_LLM_BASE_URL }}
          OMAPAK_LLM_KEY: ${{ secrets.OMAPAK_LLM_KEY }}
          OMAPAK_LLM_MODEL: ${{ secrets.OMAPAK_LLM_MODEL }}
        run: |
          for partial in out/*/report.json; do
            [ -f "$partial" ] || continue
            name=$(basename "$(dirname "$partial")")
            source_dir=""
            [ -d "sources/$name" ] && source_dir="--source-dir sources/$name"
            cargo run -q -p omapak-judge -- "pr-apps/apps/$name" --partial "$partial" $source_dir --out "final/$name"
          done

      - name: Push reports to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          for dir in final/*/; do
            name=$(basename "$dir")
            [ -f "$dir/report.json" ] || continue
            rclone copyto "$dir/report.json" ":s3,provider=Cloudflare,endpoint=\${R2_ENDPOINT}\:omapak-repo/reports/${name}.json" --s3-access-key-id "$R2_ACCESS_KEY_ID" --s3-secret-access-key "$R2_SECRET_ACCESS_KEY" --s3-no-check-bucket
          done

      - name: Post report comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            const prNumber = run.pull_requests[0]?.number;
            if (!prNumber) { core.warning('no PR associated with this run'); return; }
            if (!fs.existsSync('final')) { core.info('no reports to post'); return; }
            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100,
            });
            for (const dir of fs.readdirSync('final')) {
              const md = fs.readFileSync(`final/${dir}/report.md`, 'utf8');
              const marker = md.split('\n')[0];
              const prior = existing.data.find(c => c.body.startsWith(marker));
              if (prior) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: prior.id, body: md,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: prNumber, body: md,
                });
              }
            }
