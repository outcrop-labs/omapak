name: judge-report

# Phase 2: agent rubric + PR comment. Triggered by judge.yml completing, so
# it runs on the default branch context and gets secrets. GitHub rejects
# workflows that workflow_run-reference themselves, hence the split.
on:
  workflow_run:
    workflows: [judge]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  judge:
    # Run on failed judge runs too: a red judge means an app failed a
    # gate or build, and the partial report carries the reason — that's
    # the report the submitter most needs to see. Only cancelled runs
    # have nothing worth posting.
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # judge-partial carries the PR's apps/ alongside out/ and sources/
      # (uploaded by the unprivileged static-build job). PR app data
      # arrives as DATA only, never executed — the judge binary is built
      # from this main checkout. Do NOT check out the fork's head here:
      # actions/checkout refuses it from workflow_run contexts
      # (pwn-request guard), and overriding that guard would put fork
      # code in a secrets-bearing workflow.
      # Stale pending-approval runs that complete without ever executing
      # upload no artifact; downstream steps already tolerate an empty
      # tree, so don't let the download kill the job.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: judge-partial
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run judge stage on partial reports
        env:
          OMAPAK_LLM_BASE_URL: ${{ secrets.OMAPAK_LLM_BASE_URL }}
          OMAPAK_LLM_KEY: ${{ secrets.OMAPAK_LLM_KEY }}
          OMAPAK_LLM_MODEL: ${{ secrets.OMAPAK_LLM_MODEL }}
        run: |
          for partial in out/*/report.json; do
            [ -f "$partial" ] || continue
            name=$(basename "$(dirname "$partial")")
            source_dir=""
            [ -d "sources/$name" ] && source_dir="--source-dir sources/$name"
            # The judge exits nonzero when the recommendation isn't
            # "accept" — that's a report to deliver, not a CI failure.
            # Files under final/ are written before the exit.
            cargo run -q -p omapak-judge -- "apps/$name" --partial "$partial" $source_dir --out "final/$name" \
              || echo "::warning::$name: judge recommended against accepting"
          done

      # rclone is gone from the runner images and its S3 uploads fail
      # against R2 anyway; boto3 PUT is this repo's only proven R2 path.
      - name: Push reports to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          pip install -q boto3
          python3 - <<'EOF'
          import os, pathlib, boto3
          s3 = boto3.client("s3",
              endpoint_url=os.environ["R2_ENDPOINT"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto")
          for report in pathlib.Path("final").glob("*/report.json"):
              key = f"reports/{report.parent.name}.json"
              s3.upload_file(str(report), "omapak-repo", key)
              print(f"pushed {key}")
          EOF

      # No in-repo report commits: main's branch protection requires pull
      # requests, and the site reads its reports live from R2 anyway
      # (repo.omapak.org/reports/<id>.json) — fresher than any commit
      # could be.

      - name: Post report comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            let prNumber = run.pull_requests[0]?.number;
            if (!prNumber) {
              // Runs triggered by a maintainer's update-branch push carry
              // an empty pull_requests array in this payload — find the
              // PR by head sha instead of silently dropping the report.
              const prs = await github.rest.pulls.list({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', per_page: 100,
              });
              prNumber = prs.data.find(p => p.head.sha === run.head_sha)?.number;
            }
            if (!prNumber) { core.warning('no PR associated with this run'); return; }
            if (!fs.existsSync('final')) { core.info('no reports to post'); return; }
            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100,
            });
            for (const dir of fs.readdirSync('final')) {
              const md = fs.readFileSync(`final/${dir}/report.md`, 'utf8');
              const marker = md.split('\n')[0];
              const prior = existing.data.find(c => c.body.startsWith(marker));
              if (prior) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: prior.id, body: md,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: prNumber, body: md,
                });
              }
            }

      # Duplicate submissions (same upstream project per the submitter's
      # declared source_repo) close themselves: the report explains it,
      # and a maintainer reopens on a good-faith dispute.
      - name: Close duplicate submissions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            if (run.event !== 'pull_request') return;
            let prNumber = run.pull_requests[0]?.number;
            if (!prNumber) {
              const prs = await github.rest.pulls.list({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', per_page: 100,
              });
              prNumber = prs.data.find(p => p.head.sha === run.head_sha)?.number;
            }
            if (!prNumber || !fs.existsSync('final')) return;
            for (const dir of fs.readdirSync('final')) {
              let report;
              try { report = JSON.parse(fs.readFileSync(`final/${dir}/report.json`, 'utf8')); }
              catch { continue; }
              const dup = report.static?.duplicate_of;
              if (!dup) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber,
                body: `Closing: this duplicates \`${dup}\`, which omapak already packages (same upstream project per its declared \`source_repo\`). Updates and fixes belong in \`apps/${dup}\` and go through the same judge. If this is genuinely a different application, comment here and a maintainer will reopen.`,
              });
              await github.rest.pulls.update({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: prNumber, state: 'closed',
              });
              core.notice(`closed duplicate submission (of ${dup})`);
            }

      # The verdict as a commit status on the PR head: it shows in the PR's
      # checks, and update-sweep.yml merges an update PR only on success.
      # success = built with no critical security flag. A critical flag
      # doesn't block publication (compute_verdict), but it does hold an
      # automatic merge for a human. Merging lives in update-sweep.yml, not
      # here, so the merge token never shares a job with the PR's artifact.
      - name: Record verdict as commit status
        if: "!cancelled()"
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            if (run.event !== 'pull_request') return;
            const reports = (fs.existsSync('final') ? fs.readdirSync('final') : []).flatMap(d => {
              try { return [JSON.parse(fs.readFileSync(`final/${d}/report.json`, 'utf8'))]; }
              catch { return []; }
            });
            // A run that never executed (pending approval) has no verdict.
            if (!reports.length && run.conclusion !== 'failure') return;
            let state = 'failure', description;
            if (!reports.length) description = 'judge failed before writing a report';
            else if (reports.some(r => r.verdict !== 'published')) description = 'build failed';
            else if (reports.some(r => (r.rubric?.security_flags || []).some(f => f.severity === 'critical')))
              description = 'critical security flag: needs a human';
            else if (run.conclusion !== 'success') description = `judge run ${run.conclusion}`;
            else { state = 'success'; description = 'accept'; }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: run.head_sha,
              state, context: 'omapak/judge', description, target_url: run.html_url,
            });
