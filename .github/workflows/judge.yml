name: judge

on:
  pull_request:
    paths: ["apps/**"]
  push:
    branches: [main]
    paths: ["apps/**"]

permissions:
  contents: write

env:
  RUNTIME: org.freedesktop.Platform
  RUNTIME_VERSION: "24.08"

jobs:
  # Phase 1: static checks + real build. Runs on PRs and main with NO
  # secrets, so fork PR code never executes anywhere privileged. The LLM
  # phase lives in judge-report.yml (workflow_run trigger, so it gets
  # secrets; GitHub rejects workflows that workflow_run-reference themselves).
  static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder pipx
          # Not on PyPI under this name; install from the flathub git repo.
          pipx install git+https://github.com/flathub/flatpak-builder-lint.git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install runtime + SDK
        run: |
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive \
            flathub org.freedesktop.Platform//$RUNTIME_VERSION org.freedesktop.Sdk//$RUNTIME_VERSION

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Changed app dirs
        if: github.event_name == 'pull_request'
        run: |
          {
            git diff --name-only "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
              | grep '^apps/' | cut -d/ -f1-2 | sort -u || true
          } | tee changed.txt

      - name: Judge - static + build (no agent keys in this job)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            APPS=$(cat changed.txt)
          else
            APPS=$(find apps -mindepth 1 -maxdepth 1 -type d)
          fi
          for app in $APPS; do
            [ -d "$app" ] || continue
            echo "::group::judge $app"
            cargo run -q -p omapak-judge -- "$app" --out "out/$(basename "$app")"
            echo "::endgroup::"
          done

      - name: Clone upstream sources for the digest
        if: github.event_name == 'pull_request'
        run: |
          while read -r app; do
            [ -f "$app/metadata.yml" ] || continue
            repo=$(grep -m1 '^source_repo:' "$app/metadata.yml" | sed 's/^source_repo:[[:space:]]*//')
            [ -n "$repo" ] || continue
            git clone --depth 100 "$repo" "sources/$(basename "$app")" || echo "::warning::clone failed for $repo"
          done < changed.txt

      - uses: actions/upload-artifact@v4
        with:
          name: judge-partial
          path: |
            out/
            sources/
          retention-days: 3
          if-no-files-found: error

  # Main-branch pushes have secrets: full agent run, commit reports back
  # into apps/ so every accepted app carries its public report in-repo.
  report:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          name: judge-partial
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Full judge run for every app
        env:
          OMAPAK_LLM_BASE_URL: ${{ secrets.OMAPAK_LLM_BASE_URL }}
          OMAPAK_LLM_KEY: ${{ secrets.OMAPAK_LLM_KEY }}
          OMAPAK_LLM_MODEL: ${{ secrets.OMAPAK_LLM_MODEL }}
        run: |
          for app in apps/*/; do
            name=$(basename "$app")
            [ -f "out/$name/report.json" ] || { echo "::warning::$name has no partial report"; continue; }
            cargo run -q -p omapak-judge -- "$app" --partial "out/$name/report.json" --out "final/$name"
            cp "final/$name/report.json" "$app/report.json"
            cp "final/$name/report.md" "$app/report.md"
          done

      - name: Commit updated reports
        run: |
          git config user.name "omapak-judge"
          git config user.email "judge@omapak.outcrop.labs"
          git add apps/
          git diff --cached --quiet && echo "no report changes" && exit 0
          git commit -m "judge: refresh reports"
          git push
