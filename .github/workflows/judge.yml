name: judge

on:
  pull_request:
  push:
    branches: [main]
    paths: ["apps/**"]

permissions:
  contents: write

env:
  RUNTIME: org.freedesktop.Platform
  RUNTIME_VERSION: "24.08"

jobs:
  # Phase 1: static checks + real build. Runs on PRs and main with NO
  # secrets, so fork PR code never executes anywhere privileged. The LLM
  # phase lives in judge-report.yml (workflow_run trigger, so it gets
  # secrets; GitHub rejects workflows that workflow_run-reference themselves).
  static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          # libcairo/girepository headers: PyGObject (a flatpak-builder-lint
          # dependency) compiles from source on noble.
          sudo apt-get install -y flatpak flatpak-builder pipx \
            pkg-config libcairo2-dev libgirepository1.0-dev libglib2.0-dev
          # Not on PyPI under this name; install from the flathub git repo.
          pipx install git+https://github.com/flathub/flatpak-builder-lint.git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install runtimes + SDKs the manifests declare
        run: |
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # flathub downloads flake often enough to need a retry
          flatpak_install() {
            for attempt in 1 2 3; do
              flatpak --user install -y --noninteractive flathub "$@" && return 0
              echo "::warning::flatpak install attempt $attempt failed for $*; retrying"
              sleep 10
            done
            return 1
          }
          flatpak_install org.freedesktop.Platform//$RUNTIME_VERSION org.freedesktop.Sdk//$RUNTIME_VERSION
          # Apps may pin other runtimes (GNOME, KDE). Collect them all.
          for m in apps/*/*.yml apps/*/*.yaml apps/*/*.json; do
            [ -f "$m" ] || continue
            rt=$(grep -m1 -oE '"?runtime"?:?[[:space:]]*[":]?[a-z]+\.[A-Za-z.0-9]+' "$m" | grep -oE '[a-z]+\.[A-Za-z.0-9]+' | head -1)
            rv=$(grep -m1 -oE '"?runtime-version"?:?[[:space:]]*"?[0-9.]+' "$m" | grep -oE '[0-9.]+$')
            [ -n "$rt" ] || continue
            [ -n "$rv" ] || continue
            flatpak_install "$rt//$rv" "$rt.SDK//$rv" \
              || echo "::warning::could not install $rt//$rv"
          done

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Changed app dirs
        if: github.event_name == 'pull_request'
        run: |
          {
            git diff --name-only "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
              | grep '^apps/' | cut -d/ -f1-2 | sort -u || true
          } | tee changed.txt

      - name: Judge - static + build (no agent keys in this job)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            APPS=$(cat changed.txt)
          else
            APPS=$(find apps -mindepth 1 -maxdepth 1 -type d)
          fi
          for app in $APPS; do
            [ -d "$app" ] || continue
            echo "::group::judge $app"
            cargo run -q -p omapak-judge -- "$app" --out "out/$(basename "$app")"
            echo "::endgroup::"
          done

      - name: Clone upstream sources for the digest
        if: github.event_name == 'pull_request'
        run: |
          while read -r app; do
            [ -f "$app/metadata.yml" ] || continue
            repo=$(grep -m1 '^source_repo:' "$app/metadata.yml" | sed 's/^source_repo:[[:space:]]*//')
            [ -n "$repo" ] || continue
            git clone --depth 100 "$repo" "sources/$(basename "$app")" || echo "::warning::clone failed for $repo"
          done < changed.txt

      - uses: actions/upload-artifact@v4
        with:
          name: judge-partial
          path: |
            out/
            sources/
          retention-days: 3
          if-no-files-found: warn

  # Main-branch pushes have secrets: full agent run, commit reports back
  # into apps/ so every accepted app carries its public report in-repo.
  report:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          name: judge-partial
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Full judge run for every app
        env:
          OMAPAK_LLM_BASE_URL: ${{ secrets.OMAPAK_LLM_BASE_URL }}
          OMAPAK_LLM_KEY: ${{ secrets.OMAPAK_LLM_KEY }}
          OMAPAK_LLM_MODEL: ${{ secrets.OMAPAK_LLM_MODEL }}
        run: |
          for app in apps/*/; do
            name=$(basename "$app")
            [ -f "out/$name/report.json" ] || { echo "::warning::$name has no partial report"; continue; }
            cargo run -q -p omapak-judge -- "$app" --partial "out/$name/report.json" --out "final/$name"
            cp "final/$name/report.json" "$app/report.json"
            cp "final/$name/report.md" "$app/report.md"
          done

      - name: Upload final reports
        uses: actions/upload-artifact@v4
        with:
          name: judge-final
          path: final/
          retention-days: 90
          if-no-files-found: error
