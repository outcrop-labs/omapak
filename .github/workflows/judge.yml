name: judge

on:
  # Negated patterns, not paths-ignore: paths + paths-ignore together make
  # the filter MORE permissive (a publish.yml-only push triggered the judge
  # on 2026-09-16), the opposite of the intent.
  pull_request:
    paths:
      - "apps/**"
      - "!apps/**/report.json"
      - "!apps/**/report.md"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "!apps/**/report.json"
      - "!apps/**/report.md"

permissions:
  contents: read

jobs:
  # Phase 1: static checks + real build. Runs on PRs and main with NO
  # secrets, so fork PR code never executes anywhere privileged. The LLM
  # phase lives in judge-report.yml (workflow_run trigger, so it gets
  # secrets; GitHub rejects workflows that workflow_run-reference themselves).
  static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          # libcairo/girepository headers: PyGObject (a flatpak-builder-lint
          # dependency) compiles from source on noble.
          # libarchive-tools: flatpak-builder 1.4.11 extracts .zip sources
          # by shelling out to bsdunzip. appstream-compose: its export
          # phase runs `appstreamcli compose`, a separate addon package
          # on noble. elfutils: the strip phase shells out to eu-strip
          # (the 2026-09 runner image drift dropped all three).
          # gir1.2-appstream-1.0 + gir1.2-ostree-1.0: flatpak-builder-lint
          # imports gi's AppStream and OSTree namespaces while loading, so
          # without the typelibs EVERY subcommand dies with a Python
          # traceback — that traceback is what the flatpak-builder-lint
          # findings in every published report are. Measured in a container
          # built from this same list: move the two typelibs away and both
          # `flatpak-builder-lint appstream <metainfo>` and
          # `flatpak-builder-lint manifest <yml>` fail with `ValueError:
          # Namespace AppStream not available` / `... OSTree not available`;
          # put them back and the same two commands exit 0.
          sudo apt-get install -y flatpak pipx libarchive-tools appstream-compose appstream elfutils \
            gir1.2-appstream-1.0 gir1.2-ostree-1.0 \
            pkg-config libcairo2-dev libgirepository1.0-dev libglib2.0-dev
          # Not on PyPI under this name; install from the flathub git repo.
          pipx install git+https://github.com/flathub/flatpak-builder-lint.git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Fail in seconds if the compose addon is missing, not 15 minutes
      # into a build at export. (`sudo appstreamcli install
      # org.freedesktop.appstream.compose` — the error's own hint — needs
      # PackageKit, which the runners don't run; the apt package above
      # ships the same /usr/libexec/appstreamcli-compose binary.)
      - name: Verify AppStream Compose
        run: |
          test -x /usr/libexec/appstreamcli-compose
          appstreamcli compose --help >/dev/null

      # noble's flatpak-builder 1.4.2 can't expand bare-string source
      # includes and garbles version-pinned sdk-extensions — both standard
      # in current manifests. Build the current release instead; its only
      # build-time hazard is an appstreamcli probe that noble's appstreamcli
      # 1.0.2 fails, patched out below (compose features unused by us).
      #
      # The key carries the Ubuntu release: the binary links system libs,
      # and when ubuntu-latest moved to 26.04 (libxml2.so.2 -> .so.16) a
      # release-blind key kept restoring the noble build, which died with
      # "libxml2.so.2: cannot open shared object file" on every PR.
      - name: Runner OS release
        id: osrel
        run: echo "version=$(. /etc/os-release && echo "$VERSION_ID")" >> "$GITHUB_OUTPUT"
      - name: Cache flatpak-builder 1.4.11
        id: fbcache
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/flatpak-builder
          key: flatpak-builder-1.4.11-ubuntu${{ steps.osrel.outputs.version }}-v1
      - name: Build flatpak-builder 1.4.11
        if: steps.fbcache.outputs.cache-hit != 'true'
        run: |
          # debugedit: meson setup requires it; noble's image preinstalled
          # it, a bare 26.04 does not.
          sudo apt-get install -y meson ninja-build build-essential debugedit \
            libflatpak-dev libcurl4-openssl-dev libyaml-dev libjson-glib-dev libelf-dev
          curl -sL -o /tmp/fb.tar.xz \
            https://github.com/flatpak/flatpak-builder/releases/download/1.4.11/flatpak-builder-1.4.11.tar.xz
          echo "2a5ef4f3eaea86f808aa477e57e65b6f68978eb1c034fafe05bffdebbf1dcd03  /tmp/fb.tar.xz" | sha256sum -c
          tar -C /tmp -xf /tmp/fb.tar.xz
          cd /tmp/flatpak-builder-1.4.11
          sed -i \
            -e "s|find_program('appstreamcli', version: '>= 0.15.0')|find_program('appstreamcli', version: '>= 0.15.0', required: false)|" \
            -e "s|run_command(appstreamcli, \['compose', '--help'\], check: true)|run_command('false', check: false)|" \
            meson.build
          meson setup build --buildtype=release -D docs=disabled -D tests=false
          ninja -C build
          sudo install -m755 build/src/flatpak-builder /usr/local/bin/flatpak-builder
      - name: flatpak-builder version check
        run: flatpak-builder --version

      # TUI submissions may ship no icon: flatpak-builder's export spawns
      # bare `appstreamcli compose` through PATH, so this shim (a) injects
      # the omapak catchall under the missing icon's name when the judge
      # sets OMAPAK_TUI_CATCHALL=1 (metadata.yml tags: tui|terminal) and
      # (b) passes every other invocation through untouched — GUI apps
      # keep the icon requirement.
      - name: Install appstreamcli catchall shim
        run: |
          sudo install -m755 deploy/appstreamcli-catchall.sh /usr/local/bin/appstreamcli
          sudo install -Dm644 assets/icons/tui.png /usr/local/share/omapak/tui.png

      # One list drives both the judge loop and the source clones below. Two
      # lists is how a push run came to judge every app while cloning no
      # sources: every report it published for a public-source app said the
      # code "was not provided for audit".
      - name: App dirs to judge
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              git diff --name-only origin/main...HEAD \
                | grep '^apps/' | cut -d/ -f1-2 | sort -u || true
            }
          else
            find apps -mindepth 1 -maxdepth 1 -type d | sort
          fi | tee apps.txt

      - name: Cache flatpak runtimes
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-${{ hashFiles('apps/**/com.*', 'apps/**/io.*', 'apps/**/net.*') }}-v1
          restore-keys: flatpak-runtimes-

      # PR runs provision ONLY the changed app's toolchain: installing
      # every runtime in the merged tree (~10GB) has exhausted runner
      # disk and killed the judge mid-step.
      - name: Install runtimes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -s apps.txt ]; then
            ./deploy/install-runtimes.sh $(cat apps.txt)
          else
            ./deploy/install-runtimes.sh
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Judge - static + build (no agent keys in this job)
        run: |
          echo "disk free at judge start: $(df -h / | awk 'NR==2{print $4}')"
          APPS=$(cat apps.txt)
          for app in $APPS; do
            [ -d "$app" ] || continue
            echo "::group::judge $app"
            cargo run -q -p omapak-judge -- "$app" --out "out/$(basename "$app")"
            echo "::endgroup::"
          done

      # Runs on push too: judge-report.yml judges and publishes on both
      # events, so a source-less push run would overwrite the sourced report
      # in R2 with one that describes the pipeline instead of the app.
      - name: Clone upstream sources for the digest
        if: "!cancelled()"
        run: |
          while read -r app; do
            [ -f "$app/metadata.yml" ] || continue
            repo=$(grep -m1 '^source_repo:' "$app/metadata.yml" | sed 's/^source_repo:[[:space:]]*//')
            [ -n "$repo" ] || continue
            git clone --depth 100 "$repo" "sources/$(basename "$app")" || echo "::warning::clone failed for $repo"
          done < apps.txt

      # !cancelled(): a red judge run means an app failed a gate/build —
      # exactly when the partial report (with the reason) must reach
      # judge-report.yml. The default success() condition was silently
      # discarding it.
      #
      # apps/ rides along so judge-report.yml never has to check out the
      # fork's head itself: actions/checkout refuses fork heads from
      # workflow_run contexts (pwn-request guard), which killed every
      # report for external PRs. This job runs unprivileged on the PR
      # merge ref, so the app data reaches the privileged phase as an
      # artifact — data only, same as out/ and sources/.
      - uses: actions/upload-artifact@v4
        if: "!cancelled()"
        with:
          name: judge-partial
          path: |
            out/
            sources/
            apps/
          retention-days: 3
          if-no-files-found: warn

  # The push-path full run (reports committed into apps/, R2 push) lives in
  # judge-report.yml, which fires on this workflow's completion for PR and
  # push runs alike. A push-only job here made every PR check list show
  # "report — skipping", which read as the judge not running.
