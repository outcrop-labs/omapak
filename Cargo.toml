[workspace]
resolver = "2"
members = ["crates/omapak-core", "crates/omapak-judge"]
exclude = ["worker"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Outcrop Labs"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
