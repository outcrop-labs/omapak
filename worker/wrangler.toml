name = "omapak-repo-proxy"
main = "src/lib.rs"
compatibility_date = "2026-09-01"

# Serves repo.omapak.org: omapak objects from R2, flathub pass-through
# cached on first fetch. Deployed with the omapak Cloudflare account.
routes = [{ pattern = "repo.omapak.org/*", zone_name = "omapak.org" }]

[[r2_buckets]]
binding = "OMAPAK_REPO"
bucket_name = "omapak-repo"
