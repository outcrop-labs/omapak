<!doctype html>
<html lang="en" data-theme="mercury">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <meta name="theme-color" content="#090a09" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('omapak-theme');
          var theme =
            stored === 'mercury' || stored === 'mercury-light'
              ? stored
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'mercury-light'
                : 'mercury';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'mercury' ? '#090a09' : '#f2f0eb');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
